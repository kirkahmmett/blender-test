# Domates fidanı — 4 aşama: fide → genç → çiçekli → olgun meyveli. Terakota saksı;
# 2. aşamadan itibaren bambu çubuk ve ip bağları. Aynı bitkinin büyümesi.
pot = "@parts/pot_terracotta"         # kök anahtar: ilk [tablo] başlığından önce olmalı

[asset]
family = "tomato"
blend = "tomato"
style = "pastel"
placement = "pedestal"
material_prefix = "tomato"
spacing = 0.5

[palette]
stem_dark = "7FA77B"
stem = "97BD8E"
stem_light = "B3D3A6"
leaf_dark = "7EAD82"
leaf = "9FCB92"
leaf_light = "C3E2AF"
leaf_vein = "CDE8BC"
leaf_old = "D6D69C"          # alt yaşlı yapraklarda solgunluk
