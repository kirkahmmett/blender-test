petal_tip = "FFF6D6"
anther = "E7BF5C"
bamboo = "DCCDA2"
bamboo_node = "BFAE7F"
bamboo_highlight = "F1E7C7"
twine = "EDE2C8"

[plant]
seed = 21
soil_z = 0.164                 # saksının toprak seviyesiyle aynı
# düğümler arası mesafe (tam boy bitkide, m); aşamalar "scale" ile ölçekler
internodes = [0.030, 0.035, 0.045, 0.050, 0.055, 0.055, 0.055, 0.055, 0.055, 0.050, 0.050, 0.045]
phyllotaxis_deg = 137.5        # ardışık yaprakların arasındaki açı
stake_pos = [0.0, 0.045, 0.0]
stake_r = 0.0042

# Salkım öğeleri: ["fruit", yarıçap, olgunluk 0..1] | ["flower", boy] | ["bud", boy]
